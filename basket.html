<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина - ДоброТека</title>
    <style>
        :root {
            --header-blue: #A5E5FF;
            --sidebar-blue: #A5E5FF;
            --card-blue: #7ec8f0;
            --card-blue-light: #b8e0f7;
            --button-blue: #5bb8e8;
            --dark-blue: #0021F5;
            --text-dark: #333333;
            --text-light: #666666;
            --white: #ffffff;
            --content-max-width: 1200px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', 'Helvetica', sans-serif;
        }

        body {
            background-color: var(--white);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ==================== HEADER ==================== */
        .header {
            background-color: var(--header-blue);
            padding: 15px 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            width: 100%;
        }

        .header-inner {
            width: 100%;
            max-width: 1400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .logo-img {
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .header-nav {
            display: flex;
            gap: 30px;
        }

        .header-nav a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 16px;
            transition: 0.3s;
        }

        .header-nav a:hover {
            color: var(--dark-blue);
        }

        /* ==================== MAIN CONTENT ==================== */
        .main-content {
            flex: 1;
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 50px 20px;
        }

        .content-wrapper {
            width: 100%;
            max-width: var(--content-max-width);
        }

        .page-title {
            font-size: 32px;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 40px;
        }

        /* ==================== CART STYLES ==================== */
        .cart-container {
            background-color: var(--white);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        .cart-table {
            width: 100%;
            border-collapse: collapse;
        }

        .cart-table th {
            text-align: left;
            padding: 15px 10px;
            background-color: var(--card-blue-light);
            color: var(--text-dark);
            font-weight: 600;
            font-size: 16px;
        }

        .cart-table th:first-child {
            border-radius: 10px 0 0 10px;
        }

        .cart-table th:last-child {
            border-radius: 0 10px 10px 0;
        }

        .cart-table td {
            padding: 20px 10px;
            border-bottom: 1px solid #e0e0e0;
            vertical-align: middle;
        }

        .cart-product {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .cart-product-image {
            width: 80px;
            height: 80px;
            background-color: var(--card-blue-light);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cart-product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .cart-product-info h3 {
            font-size: 16px;
            color: var(--text-dark);
            margin-bottom: 5px;
        }

        .cart-product-category {
            font-size: 13px;
            color: var(--text-light);
        }

        .cart-price {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .cart-quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity-btn {
            width: 30px;
            height: 30px;
            background-color: var(--card-blue-light);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            color: var(--text-dark);
            transition: 0.3s;
        }

        .quantity-btn:hover {
            background-color: var(--button-blue);
            color: var(--white);
        }

        .quantity-value {
            font-size: 16px;
            font-weight: 600;
            min-width: 30px;
            text-align: center;
        }

        .cart-sum {
            font-size: 18px;
            font-weight: bold;
            color: var(--dark-blue);
        }

        .cart-remove-btn {
            width: 35px;
            height: 35px;
            background-color: #ff4d4d;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }

        .cart-remove-btn:hover {
            background-color: #ff3333;
            transform: scale(1.1);
        }

        .cart-remove-btn img {
            width: 18px;
            height: 18px;
            filter: brightness(0) invert(1);
        }

        .cart-empty {
            text-align: center;
            padding: 60px 20px;
        }

        .cart-empty p {
            font-size: 18px;
            color: var(--text-light);
            margin-bottom: 20px;
        }

        .cart-empty-btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: var(--dark-blue);
            color: var(--white);
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .cart-empty-btn:hover {
            background-color: var(--button-blue);
            transform: translateY(-2px);
        }

        .cart-footer {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid var(--card-blue-light);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .cart-total {
            font-size: 24px;
            font-weight: bold;
            color: var(--text-dark);
        }

        .cart-total span {
            color: var(--dark-blue);
            margin-left: 15px;
        }

        .cart-actions {
            display: flex;
            gap: 15px;
        }

        .cart-btn {
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border: none;
            text-decoration: none;
            display: inline-block;
        }

        .cart-btn-primary {
            background-color: var(--dark-blue);
            color: var(--white);
        }

        .cart-btn-primary:hover {
            background-color: var(--button-blue);
            transform: translateY(-2px);
        }

        .cart-btn-secondary {
            background-color: var(--card-blue-light);
            color: var(--text-dark);
        }

        .cart-btn-secondary:hover {
            background-color: var(--card-blue);
            transform: translateY(-2px);
        }

        /* ==================== FOOTER ==================== */
        .footer {
            background-color: var(--header-blue);
            padding: 50px 60px;
            width: 100%;
            margin-top: auto;
        }

        .footer-content {
            max-width: var(--content-max-width);
            margin: 0 auto;
        }

        .footer-headline {
            font-size: 24px;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 40px;
            font-weight: 500;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 50px;
            align-items: center;
        }

        .footer-contact {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .footer-contact p {
            font-size: 15px;
            color: var(--text-dark);
        }

        .footer-phone {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 19px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .footer-phone-icon {
            width: 35px;
            height: 35px;
            background-color: var(--button-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .footer-phone-icon img {
            width: 55%;
            height: 55%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .footer-social {
            display: flex;
            gap: 25px;
        }

        .footer-social a {
            width: 50px;
            height: 50px;
            background-color: var(--button-blue);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: 0.3s;
        }

        .footer-social a:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .footer-social a img {
            width: 55%;
            height: 55%;
            object-fit: contain;
            filter: brightness(0) invert(1);
        }

        .footer-links {
            display: flex;
            flex-direction: column;
            gap: 18px;
            text-align: right;
        }

        .footer-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-size: 17px;
            transition: 0.3s;
        }

        .footer-links a:hover {
            color: var(--dark-blue);
        }

        .footer-copyright {
            text-align: center;
            margin-top: 40px;
            padding-top: 25px;
            border-top: 1px solid rgba(91, 184, 232, 0.5);
            font-size: 15px;
            color: var(--text-dark);
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 768px) {
            .header {
                padding: 15px 20px;
            }
            .header-inner {
                flex-direction: column;
                gap: 15px;
            }
            .header-nav {
                gap: 15px;
                flex-wrap: wrap;
                justify-content: center;
            }
            .footer {
                padding: 40px 20px;
            }
            .footer-grid {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 35px;
            }
            .footer-links {
                text-align: center;
            }
            .cart-table {
                display: block;
                overflow-x: auto;
            }
            .cart-footer {
                flex-direction: column;
                text-align: center;
            }
            .cart-actions {
                width: 100%;
                justify-content: center;
            }
        }

        @media (max-width: 480px) {
            .page-title {
                font-size: 24px;
            }
            .cart-product {
                flex-direction: column;
                text-align: center;
            }
            .cart-quantity {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- ==================== HEADER ==================== -->
    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <div class="logo-img">
                    <img src="img/logo.png" alt="Логотип" id="logo-img">
                </div>
                <span>ДоброТека</span>
            </div>
            <nav class="header-nav">
                <a href="index.html">Главная</a>
                <a href="about.html">О нас</a>
                <a href="catalog.html">Каталог</a>
                <a href="contacts.html">Контакты</a>
                <a href="basket.html">Корзина</a>
            </nav>
        </div>
    </header>

    <!-- ==================== MAIN CONTENT ==================== -->
    <main class="main-content">
        <div class="content-wrapper">
            <h1 class="page-title">Корзина</h1>
            
            <div class="cart-container" id="cartContainer">
                <!-- Корзина будет загружена сюда -->
                <div class="cart-empty">
                    <p>Загрузка...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- ==================== FOOTER ==================== -->
    <footer class="footer">
        <div class="footer-content">
            <h3 class="footer-headline">Ассортимент, от которого здоровеешь уже при входе</h3>
            <div class="footer-grid">
                <div class="footer-contact">
                    <p>Остались вопросы? Звоните</p>
                    <div class="footer-phone">
                        <div class="footer-phone-icon">
                            <img src="img/Phone.png" alt="Телефон">
                        </div>
                        <span>+7 (980) 789-78-90</span>
                    </div>
                </div>
                <div class="footer-social">
                    <a href="#">
                        <img src="img/Telegram App.png" alt="Telegram">
                    </a>
                    <a href="#">
                        <img src="img/Twitter Bird.png" alt="Twitter">
                    </a>
                    <a href="#">
                        <img src="img/Facebook.png" alt="Facebook">
                    </a>
                    <a href="#">
                        <img src="img/VK Circled.png" alt="VK">
                    </a>
                </div>
                <div class="footer-links">
                    <a href="catalog.html">Каталог</a>
                    <a href="about.html">О нас</a>
                    <a href="basket.html">Корзина</a>
                </div>
            </div>
            <div class="footer-copyright">
                © ДоброТека. Все права защищены.
            </div>
        </div>
    </footer>

    <script>
        // Данные о товарах (копия из каталога для корректного отображения)
        const products = {
            1: { name: "Аскорбиновая кислота", category: "Витамины", price: "60 ₽", priceValue: 60, image: "img/Cat/ascorbinka.png" },
            2: { name: "Кальций D3 Форте", category: "Витамины", price: "930 ₽", priceValue: 930, image: "img/Cat/kalziy.png" },
            3: { name: "Магнелис B6", category: "Витамины", price: "760 ₽", priceValue: 760, image: "img/Cat/magnelis.png" },
            4: { name: "Амиксин", category: "Имунные лекарства", price: "1100 ₽", priceValue: 1100, image: "img/Cat/amixin.png" },
            5: { name: "Изопринозин", category: "Имунные лекарства", price: "980 ₽", priceValue: 980, image: "img/Cat/izoprinozin.png" },
            6: { name: "Деринат спрей", category: "Имунные лекарства", price: "510 ₽", priceValue: 510, image: "img/Cat/derinat.png" },
            7: { name: "Грамицидин C Реневал", category: "ОРВИ и ОРЗ", price: "442 ₽", priceValue: 442, image: "img/Cat/gramizidin.png" },
            8: { name: "Каметон", category: "ОРВИ и ОРЗ", price: "190 ₽", priceValue: 190, image: "img/Cat/kameton.png" },
            9: { name: "Гексорал Табс Классик", category: "ОРВИ и ОРЗ", price: "270 ₽", priceValue: 270, image: "img/Cat/geksoral.png" },
            10: { name: "Зодак", category: "От аллергии", price: "330 ₽", priceValue: 330, image: "img/Cat/zodak.png" },
            11: { name: "Дуоназе", category: "От аллергии", price: "900 ₽", priceValue: 900, image: "img/Cat/duonaze.png" },
            12: { name: "Кларитин", category: "От аллергии", price: "280 ₽", priceValue: 280, image: "img/Cat/klaritin.png" },
            13: { name: "Бинт нестерильный", category: "Мед товары", price: "70 ₽", priceValue: 70, image: "img/Cat/bint.png" },
            14: { name: "Лейкопластырь", category: "Мед товары", price: "130 ₽", priceValue: 130, image: "img/Cat/plastry.png" },
            15: { name: "Перчатки медицинские", category: "Мед товары", price: "230 ₽", priceValue: 230, image: "img/Cat/perchatki.png" }
        };

        // Функция для рендеринга корзины
        function renderCart() {
            const cartContainer = document.getElementById('cartContainer');
            const cart = JSON.parse(localStorage.getItem('cart')) || [];

            if (cart.length === 0) {
                cartContainer.innerHTML = `
                    <div class="cart-empty">
                        <p>Ваша корзина пуста</p>
                        <a href="catalog.html" class="cart-empty-btn">Перейти к покупкам</a>
                    </div>
                `;
                return;
            }

            let html = '<table class="cart-table">';
            html += `
                <thead>
                    <tr>
                        <th>Товар</th>
                        <th>Цена</th>
                        <th>Количество</th>
                        <th>Сумма</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
            `;

            let totalSum = 0;

            cart.forEach((item, index) => {
                const productInfo = products[item.id] || item;
                const itemSum = item.priceValue * item.quantity;
                totalSum += itemSum;

                html += `
                    <tr>
                        <td>
                            <div class="cart-product">
                                <div class="cart-product-image">
                                    <img src="${productInfo.image}" alt="${productInfo.name}">
                                </div>
                                <div class="cart-product-info">
                                    <h3>${productInfo.name}</h3>
                                    <span class="cart-product-category">${productInfo.category}</span>
                                </div>
                            </div>
                        </td>
                        <td class="cart-price">${productInfo.price}</td>
                        <td>
                            <div class="cart-quantity">
                                <button class="quantity-btn" onclick="updateQuantity(${index}, -1)">−</button>
                                <span class="quantity-value">${item.quantity}</span>
                                <button class="quantity-btn" onclick="updateQuantity(${index}, 1)">+</button>
                            </div>
                        </td>
                        <td class="cart-sum">${itemSum} ₽</td>
                        <td>
                            <button class="cart-remove-btn" onclick="removeFromCart(${index})">
                                <img src="img/Delete.png" alt="Удалить">
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += '</tbody></table>';

            html += `
                <div class="cart-footer">
                    <div class="cart-total">
                        Итого: <span>${totalSum} ₽</span>
                    </div>
                    <div class="cart-actions">
                        <a href="catalog.html" class="cart-btn cart-btn-secondary">Продолжить покупки</a>
                        <button class="cart-btn cart-btn-primary" onclick="checkout()">Оформить заказ</button>
                    </div>
                </div>
            `;

            cartContainer.innerHTML = html;
        }

        // Функция для обновления количества
        function updateQuantity(index, change) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart[index]) {
                cart[index].quantity += change;
                if (cart[index].quantity < 1) {
                    cart[index].quantity = 1;
                }
                localStorage.setItem('cart', JSON.stringify(cart));
                renderCart();
            }
        }

        // Функция для удаления из корзины
        function removeFromCart(index) {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            renderCart();
        }

        // Функция для оформления заказа
        function checkout() {
            const cart = JSON.parse(localStorage.getItem('cart')) || [];
            if (cart.length > 0) {
                alert('Спасибо за заказ! Наш менеджер свяжется с вами для подтверждения.');
                localStorage.removeItem('cart');
                renderCart();
            }
        }

        // Рендерим корзину при загрузке
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>

</body>
</html>
